apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: auto-instrumentation
  namespace: opentelemetry-collector
spec:
  exporter:
    endpoint: http://lb-grafana-alloy-traces.monitoring.svc.cluster.local:4317
  propagators:
  - tracecontext
  - baggage
  - b3
  sampler:
    argument: '1'
    type: parentbased_traceidratio

  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:1.33.6
    env:
    - name: OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS
      value: "true"
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: "http://lb-grafana-alloy-traces.monitoring.svc.cluster.local:4317"
    - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
      value: "http://grafana-alloy-metrics-apps.monitoring.svc.cluster.local:4317"
    - name: OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS
      value: "true"
    - name: OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS
      value: "true"
    - name: OTEL_INSTRUMENTATION_COMMON_METRICS_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_SERVLET_METRICS_ENABLED
      value: "true"
    - name: OTEL_JAVAAGENT_LOGGING
      value: "simple"
    - name: OTEL_INSTRUMENTATION_APACHE_HTTPCLIENT_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_COMMON_EXPERIMENTAL_CONTROLLER_TELEMETRY_ENABLED
      value: "true"
    - name: OTEL_INSTRUMENTATION_MICROMETER_ENABLED
      value: "true"

  nodejs:
    env:
    - name: OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS
      value: "true"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://lb-grafana-alloy-traces.monitoring.svc.cluster.local:4317"
 

