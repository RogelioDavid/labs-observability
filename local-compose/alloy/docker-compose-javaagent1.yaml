version: "3.4"
services:

  # The hello-observability application
  ms-hello-observability-services.applications.svc.cluster.local:
    image: rmendoza/hello-observability-manual:v2-java17
    volumes:
      - ./logs/hello-observability.log:/tmp/hello-observability.log
      - ./logs/access_log.log:/tmp/access_log.log
    environment:
      JAVA_TOOL_OPTIONS: -javaagent:./opentelemetry-javaagent.jar -Dotel.instrumentation.micrometer.enabled=true -Dotel.instrumentation.common-metrics.enabled=true -Dotel.instrumentation.common.default-enabled=true -Dotel.instrumentation.servlet-metrics.enabled=true -Dotel.instrumentation.common.enabled=true -Dotel.instrumentation.runtime-telemetry.enabled=true
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://grafana-alloy-traces:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy-traces:4317
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:  http://grafana-alloy-traces:4317
      OTEL_SERVICE_NAME: ms-hello-observability-services
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: true
      OTEL_INSTRUMENTATION_APACHE_HTTPCLIENT_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: true
      OTEL_INSTRUMENTATION_JETTY_HTTPCLIENT_ENABLED: true
      OTEL_INSTRUMENTATION_JAVA_HTTP_CLIENT_ENABLED: true
      OTEL_INSTRUMENTATION_HTTP_CLIENT_EMIT_EXPERIMENTAL_TELEMETRY: true 
      OTEL_INSTRUMENTATION_HTTP_SERVER_EMIT_EXPERIMENTAL_TELEMETRY: true
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_RESPONSE_HEADERS: X-Tenant-ID
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_RESPONSE_HEADERS: X-Tenant-ID
      OTEL_INSTRUMENTATION_COMMON_METRICS_ENABLED: true
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: true
      OTEL_INSTRUMENTATION_SERVLET_ENABLED: true
      OTEL_INSTRUMENTATION_HTTP_URL_CONNECTION_ENABLED: true
      OTEL_INSTRUMENTATION_OKHTTP_ENABLED: true
      OTEL_JAVAAGENT_LOGGING: simple
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_INSTRUMENTATION_JDBC_CAPTURE_EXPERIMENTAL_SPAN_ATTRIBUTES: true
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: X-Tenant-ID 
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS: X-Tenant-ID
      OTEL_INSTRUMENTATION_SERVLET_CAPTURE_HEADERS: X-Tenant-ID
      HOSTNAME: ms-hello-observability-services.applications.svc.cluster.local
    ports:
      - "8080:8080"


  ms-service-app-ms1.applications.svc.cluster.local:
    image: rmendoza/ms-service-app-ms1-manual:v2
    volumes:
      # Log files. They are all also accessible to the agent container,
      # through docker volume mount
      - ./logs/ms-service-app-ms1.log:/tmp/ms-service-app-ms1.log
      - ./logs/access_log.log:/tmp/access_log.log
    environment:
      # Tracing configuration
      JAVA_TOOL_OPTIONS: -javaagent:./opentelemetry-javaagent.jar  -Dotel.instrumentation.http.server.capture-request-headers=X-Tenant-ID -Dotel.instrumentation.servlet.experimental-span-attributes=true -Dotel.instrumentation.http.server.capture-request-headers=X-Tenant-ID -Dotel.instrumentation.servlet.capture-headers=X-Tenant-ID -Dotel.instrumentation.common.default-enabled=true -Dotel.instrumentation.micrometer.enabled=true -Dotel.instrumentation.common-metrics.enabled=true -Dotel.instrumentation.common.default-enabled=true -Dotel.instrumentation.servlet-metrics.enabled=true -Dotel.instrumentation.common.enabled=true -Dotel.instrumentation.runtime-telemetry.enabled=true
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://grafana-alloy-traces:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy-traces:4317
      OTEL_SERVICE_NAME: ms-service-app-ms1
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: true
      OTEL_INSTRUMENTATION_APACHE_HTTPCLIENT_ENABLED: true
      OTEL_INSTRUMENTATION_SPRING_WEB_ENABLED: true
      OTEL_INSTRUMENTATION_JETTY_HTTPCLIENT_ENABLED: true
      OTEL_INSTRUMENTATION_JAVA_HTTP_CLIENT_ENABLED: true
      OTEL_INSTRUMENTATION_HTTP_CLIENT_EMIT_EXPERIMENTAL_TELEMETRY: true 
      OTEL_INSTRUMENTATION_HTTP_SERVER_EMIT_EXPERIMENTAL_TELEMETRY: true
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_RESPONSE_HEADERS: X-Tenant-ID
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_RESPONSE_HEADERS: X-Tenant-ID
      OTEL_INSTRUMENTATION_COMMON_METRICS_ENABLED: true
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: true
      OTEL_INSTRUMENTATION_SERVLET_ENABLED: true
      OTEL_INSTRUMENTATION_HTTP_URL_CONNECTION_ENABLED: true
      OTEL_INSTRUMENTATION_OKHTTP_ENABLED: true
      OTEL_JAVAAGENT_LOGGING: simple
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_INSTRUMENTATION_JDBC_CAPTURE_EXPERIMENTAL_SPAN_ATTRIBUTES: true
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: X-Tenant-ID 
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS: X-Tenant-ID
      OTEL_INSTRUMENTATION_SERVLET_CAPTURE_HEADERS: X-Tenant-ID
      HOSTNAME: ms-service-app-ms1.applications.svc.cluster.local
    ports:
      - "8081:8081"

  ms-service-app-ms2.applications.svc.cluster.local:
    image: rmendoza/ms-service-app-ms2-manual:v2
    volumes:
      # Log files. They are all also accessible to the agent container,
      # through docker volume mount
      - ./logs/ms-service-app-ms2.log:/tmp/ms-service-app-ms2.log
      - ./logs/access_log.log:/tmp/access_log.log
    environment:
      # Tracing configuration
      JAVA_TOOL_OPTIONS: -javaagent:./opentelemetry-javaagent.jar    
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://grafana-alloy-traces:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy-traces:4317
      OTEL_SERVICE_NAME: ms-service-app-ms2
      OTEL_TRACES_EXPORTER: otlp
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: true
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS: true
      OTEL_METRICS_EXPORTER: otlp
      OTEL_PROPAGATORS: "tracecontext,baggage"
      HOSTNAME: ms-service-app-ms2.applications.svc.cluster.local
    ports:
      - "8082:8082"

  ms-user-observability-services.client.svc.cluster.local:
    image: rmendoza/user-observability-manual:v1.1
    volumes:
      # Log files. They are all also accessible to the agent container,
      # through docker volume mount
      - ./logs/ms-user-observability-services.log:/tmp/ms-user-observability-services.log
      - ./logs/access_log.log:/tmp/access_log.log
    environment:
      # Tracing configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy-traces:4317
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://grafana-alloy-traces:4317
      OTEL_SERVICE_NAME: ms-user-observability-services
      SERVICE_NAME: service.name
      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_LOG_LEVEL: debug
      HOSTNAME: ms-service-app-ms2.applications.svc.cluster.local
    ports:
      - "3000:3000"

  grafana-alloy-traces:
    container_name: grafana-alloy-traces 
    image: grafana/alloy:v1.8.0
    volumes:
      - ./config/config-traces.alloy:/etc/agent/config.alloy
    command:
      - run
      - /etc/agent/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
 #     - -config.file=/etc/agent/config.river
 #     - -config.file=/etc/agent-config/agent.yaml      
    environment:
      HOSTNAME: grafana-alloy-traces
    ports:
       - "4317:4317"
       - "4318:4318"
       - "9464:9464"
       
  grafana-alloy-metrics-logs:
    image: grafana/alloy:v1.8.0
    volumes:
      - ./config/config-metrics-logs.alloy:/etc/agent/config.alloy
      - ./logs/hello-observability.log:/tmp/hello-observability.log
      - ./logs/ms-service-app-ms2.log:/tmp/ms-service-app-ms2.log
      - ./logs/ms-service-app-ms1.log:/tmp/ms-service-app-ms1.log      
      - ./logs/ms-user-observability-services.log:/tmp/ms-user-observability-services.log      
    command:
      - run
      - /etc/agent/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      HOSTNAME: grafana-alloy-metrics
   
  # Our load generator
  ubuntu-local:
    image: ubuntu
    restart: on-failure
    command: ["sleep","infinity"]


